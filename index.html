<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mix Bench">
<meta name="theme-color" content="#0A0A0B">
<meta name="description" content="Plan, mix, steep and track your DIY e-liquid stock.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Mix Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, flat white cards on a light grey ground. Black for actions, orange for whatever is selected, neon traffic lights. */
:root{
  --sel:#F28C28; --sel-ink:#0A0A0B; --neon-g:#39FF14; --neon-a:#FFB000; --neon-r:#FF1744; --lamp-ring:rgba(0,0,0,.35);
  --bg:#F4F4F5; --card:#FFFFFF; --ink:#0A0A0B; --muted:#6E6E73; --line:#E6E6E8; --soft:#F0F0F2;
  --accent:#0A0A0B; --accent-ink:#FFFFFF; --ok:#1E8A4F; --low:#C2620E; --out:#C62F3E; --amber:#D99A0B;
  --font:'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bar-empty:#000;
    --bg:#0A0A0B; --card:#141416; --ink:#F2F2F3; --muted:#8E8E93; --line:#26262A; --soft:#1D1D20;
    --lamp-ring:rgba(0,0,0,.6);
    --accent:#F2F2F3; --accent-ink:#0A0A0B; --ok:#4CC08A; --low:#E98B4E; --out:#F0606F; --amber:#F2C14E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bar-empty:#000;
  --bg:#0A0A0B; --card:#141416; --ink:#F2F2F3; --muted:#8E8E93; --line:#26262A; --soft:#1D1D20;
  --lamp-ring:rgba(0,0,0,.6);
  --accent:#F2F2F3; --accent-ink:#0A0A0B; --ok:#4CC08A; --low:#E98B4E; --out:#F0606F; --amber:#F2C14E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:20px 16px calc(84px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-0.025em;margin:6px 0 4px}
.lede{color:var(--muted);margin:0 0 16px;font-size:13px}
h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}

.rlist{display:grid;gap:3px;margin:8px 0 2px;font-size:13px}
.recipe-name{font-weight:600;font-size:15px;line-height:1.25}
.mix-list{display:grid;gap:4px}
.starbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.starbtn.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.mix-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:13px}
.mix-row.on{background:var(--soft)}
.zero-tick{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;font-weight:500;cursor:pointer}
.zero-tick input{width:18px;height:18px;accent-color:var(--sel);margin:0}
.light{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;font-weight:500}
.lamp{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.lamp.green{background:var(--neon-g);box-shadow:0 0 0 1px var(--lamp-ring),0 0 6px 1px rgba(57,255,20,.7)}
.lamp.amber{background:var(--neon-a);box-shadow:0 0 0 1px var(--lamp-ring),0 0 6px 1px rgba(255,176,0,.7)}
.lamp.red{background:var(--neon-r);box-shadow:0 0 0 1px var(--lamp-ring),0 0 6px 1px rgba(255,23,68,.65)}
.light.green{color:var(--ok)} .light.amber{color:var(--low)} .light.red{color:var(--out)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{width:38px;height:38px;border:0;background:transparent;font-size:18px;font-weight:500;cursor:pointer}
.stepper input{width:60px;height:38px;border:0;background:transparent;text-align:center;font-weight:600;font-size:16px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{color:var(--muted);font-size:12px;margin-left:-4px;margin-right:4px}
details summary{cursor:pointer;color:var(--ink);font-weight:500;font-size:13px;margin-top:6px;list-style:none;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:6px}
.recsum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;font-size:15px;font-weight:600;color:var(--ink);padding:2px 0;text-decoration:none}
.recsum::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-3px 4px 0 4px;flex:none}
details[open] > .recsum::after{transform:rotate(-135deg);margin-top:3px}
.recsum .sub{margin-left:auto;white-space:nowrap;font-size:12px;font-weight:500;color:var(--muted)}
details[open] > summary.recsum{margin-bottom:10px}
.steps{margin:0;padding-left:20px;font-size:15px;line-height:1.5}
.steps li{padding:5px 0}
.steps li.note{color:var(--muted);font-size:13px;padding-top:8px}
.tick{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.tick input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--sel)}
input[type=checkbox]{accent-color:var(--sel)}
.tick span{min-width:0}
.steps li.done .tick span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.steps b{font-variant-numeric:tabular-nums}

.btn{display:block;width:100%;border:0;border-radius:10px;padding:11px 14px;font-weight:600;font-size:13px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--out);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn + .btn{margin-top:8px}
.grid2 > .btn,[style*="grid-template-columns"] > .btn{margin-top:0}
.linkbtn{border:0;background:none;color:var(--ink);font-weight:500;padding:5px 0;cursor:pointer;font-size:12px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none;background:var(--muted)!important}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.low{color:var(--low)} .pill.out{color:var(--out)}
.shop-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px}
.shop-head h3{margin:0;font-size:14px;font-weight:600}
.buy{font-weight:600;font-size:13px}
.have{color:var(--muted);font-size:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px;letter-spacing:-0.01em}
.stat{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px}
.stat .v{text-align:right;font-weight:600}
.save{color:var(--ok)}
.left{font-weight:600;font-size:14px;text-align:right}
.meter{height:3px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:7px}
.meter span{display:block;height:100%;background:var(--ink)!important}

label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px}
textarea.field{min-height:100px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 > *{min-width:0}
input.field[type=date],input.field[type=number]{display:block;width:100%;min-width:0;max-width:100%;height:42px;padding:0 12px;-webkit-appearance:none;appearance:none;text-align:left;font-size:14px}
input.field[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input.field[type=date]::-webkit-calendar-picker-indicator{opacity:.5}
.price-row{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.price-row:last-child{border-bottom:0}
.price-row input,.mix-row input[type=number]{width:78px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--bg);text-align:center;font-size:16px}
.price-row input{width:100%}
.price-row input:disabled{background:var(--soft);color:var(--muted);border-color:transparent;opacity:1;-webkit-text-fill-color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--card) 92%, transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{border:0;background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="page"]{color:var(--sel-ink);background:var(--sel);border-radius:10px}
.badge{position:relative}
.badge[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-4px;right:-9px;background:var(--ink);color:var(--bg);font-size:9px;font-weight:700;border-radius:999px;padding:1px 5px}

.sheet-wrap{margin:10px 0;scroll-margin:80px}
.sheet{background:var(--card);border:1px solid var(--ink);border-radius:14px;padding:16px}
.sheet h3{margin:0 0 6px;font-size:16px;font-weight:600}
.sheet .list li{padding:7px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:500;font-size:13px;z-index:30;max-width:90vw;text-align:center}
.empty{color:var(--muted);text-align:center;padding:16px 0}
.brandbar{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.02em;margin:0 0 6px}
.logo{width:1.4em;height:1.4em;flex:none;border-radius:22%;display:block}
.sect{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:28px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:8px}
.qrow label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.qrow input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--card);text-align:center;font-size:16px;min-width:0}
.qrow input[data-q]{border-color:var(--sel);border-width:2px}
.qrow .x{color:var(--muted);padding-bottom:10px}
.qrow .qcost{min-width:58px;text-align:right;padding-bottom:9px;font-size:14px}
.tip:empty,[data-sugg]:empty{display:none}
.tip{color:var(--low);font-weight:600}
.btn.sel{background:var(--sel);color:var(--sel-ink);margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}
.bsteps{margin:8px 0 0;padding-left:20px;font-size:13px}
.bsteps li{padding:4px 0}
.steps-bar{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;position:relative}
.steps-bar::before{content:"";position:absolute;left:12.5%;right:12.5%;top:7px;height:1px;background:var(--line)}
.stp{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:500;text-align:center}
.stp .pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);position:relative;z-index:1}
.stp.on .pip{background:var(--sel);border-color:var(--sel)}
.stp.cur{color:var(--ink)}
.stp.cur .pip{box-shadow:0 0 0 3px var(--soft)}
.hist-item{display:flex;gap:10px;align-items:flex-start}
.hist-item .x{margin-left:auto;border:0;background:var(--soft);border-radius:8px;width:30px;height:30px;flex:none;cursor:pointer;font-size:14px;color:var(--muted)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
:root{--bar-fill:var(--sel);--bar-empty:#0A0A0B}
.sbar{height:8px;border-radius:4px;background:var(--bar-empty);overflow:hidden;margin-top:8px;box-shadow:inset 0 0 0 1px var(--line)}
.sbar span{display:block;height:100%;background:var(--bar-fill);border-radius:4px 0 0 4px}
.sbar.low span{background:var(--out)}
.srow{display:block;width:100%;border:0;background:none;padding:12px 0;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .amt{font-weight:700;font-size:14px}
.srow .warn{color:var(--out);font-size:12px;font-weight:600;margin-left:6px}
.sdet{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tstars{display:flex;gap:4px;margin:6px 0 8px}
.tstar{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.tstar.on{color:var(--bar-fill)}
.trow{display:grid;gap:4px;margin:8px 0}
.trow > span{font-size:12px;color:var(--muted);font-weight:600}
.tchips{display:flex;flex-wrap:wrap;gap:4px}
.tchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.tchip.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.taste{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.taste-h{font-weight:700}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.fb-h{font-weight:700;font-size:13px}
.fb .stars,.stars{color:var(--bar-fill);letter-spacing:1px}
.fb-btns{display:flex;gap:6px;margin-top:8px}
.btn.sm{padding:7px 10px;font-size:12px;width:auto;display:inline-block}
.mgseg{display:flex;gap:4px;margin-top:6px}
.mgseg button{flex:1;border:0;border-radius:8px;padding:7px 0;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink);cursor:pointer}
.mgseg button.on{background:var(--sel);color:var(--sel-ink)}
.mgseg button:disabled{opacity:.35;cursor:default}
.pill.ready{background:var(--ok);color:#fff}
.card > h2:first-child{margin-top:0}
.prevord{border-bottom:1px solid var(--line);padding:10px 0}
.prevord:last-child{border-bottom:0}
.prevord > summary.prevsum{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;color:var(--ink);text-decoration:none;font-size:14px;font-weight:400;margin:0}
.prevord > summary.prevsum::-webkit-details-marker{display:none}
.prevord > summary.prevsum::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-3px 4px 0 4px;flex:none}
.prevord[open] > summary.prevsum::after{transform:rotate(-135deg);margin-top:3px}
.prevord[open] > summary.prevsum{margin-bottom:8px}
.steepsum{display:flex;align-items:center;justify-content:space-between;gap:10px}
.steepsum .btn{width:auto}
/* Plan rows: orange band, bold black text, black arrow; neon lights get a thin black outline so they stand out on orange */
.steepsum{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.steepsum b{font-weight:700}
.steepsum .muted{color:var(--sel-ink)}
.steepsum .btn.secondary{background:var(--sel-ink);color:var(--sel)}
.onorange .lamp.green{box-shadow:0 0 0 1.5px #000,0 0 6px 1px rgba(57,255,20,.7)}
.onorange .lamp.amber{box-shadow:0 0 0 1.5px #000,0 0 6px 1px rgba(255,176,0,.7)}
.onorange .lamp.red{box-shadow:0 0 0 1.5px #000,0 0 6px 1px rgba(255,23,68,.65)}
.card > details[data-box] > summary.recsum{background:var(--sel);color:var(--sel-ink);font-weight:700;margin:-14px;padding:14px;border-radius:13px}
.card > details[data-box][open] > summary.recsum{border-radius:13px 13px 0 0;margin-bottom:12px}
.card > details[data-box] > summary.recsum::after{border-color:var(--sel-ink);border-width:0 2px 2px 0}
.card > details[data-box] > summary.recsum .sub{color:var(--sel-ink);font-weight:600}
.led{display:flex;align-items:flex-start;justify-content:center;gap:4px;flex-wrap:wrap;background:#000;color:var(--sel);border-radius:12px;padding:12px 10px 10px;margin:10px 0 8px;font-family:'Share Tech Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;text-shadow:0 0 8px rgba(242,140,40,.55);box-shadow:inset 0 0 0 1px #1d1d20;font-variant-numeric:tabular-nums}
.led-u{display:flex;flex-direction:column;align-items:center;min-width:0}
.led-d{font-size:clamp(28px,9vw,46px);line-height:1;letter-spacing:.04em}
.led-l{font-size:9px;letter-spacing:.14em;opacity:.7;margin-top:4px;font-family:var(--font)}
.led-c{font-size:clamp(24px,8vw,40px);line-height:1;opacity:.8}
.led-ready{font-size:clamp(22px,7vw,34px);letter-spacing:.08em;padding:6px 0}
.led-sm{font-size:clamp(32px,10vw,48px);line-height:1;letter-spacing:.06em;padding:14px 10px}
.tm-done{margin:2px 0 8px;padding:8px 10px;border-radius:8px;background:var(--sel);color:var(--sel-ink);font-weight:700;text-align:center}
.tbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tbtns .btn{width:100%;margin:0}
.tbtns2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbtns2 .btn{width:auto;margin:0}
.shake-banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--sel);color:var(--sel-ink);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.shake-banner .btn.secondary{background:rgba(0,0,0,.12);color:var(--sel-ink)}
.steepcard .pill.ready,.pill.ready{background:var(--ok);color:#fff}

@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .2s ease-out} @keyframes up{from{transform:translateY(6px);opacity:.5}to{transform:none;opacity:1}} }
/* motion: short, light, off with Reduce Motion */
:root{--bottle-edge:#2b2b2f}
.view-in{animation:viewIn .2s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.confetti{position:fixed;width:0;height:0;pointer-events:none;z-index:60}
.confetti i{position:absolute;left:-3px;top:-5px;width:7px;height:10px;border-radius:2px;animation:cf .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),calc(var(--y) + 60px)) rotate(var(--r));opacity:0}}
.led-d{display:inline-block;transform-origin:50% 50%}
.led-d.flip{animation:ledFlip .32s ease-out}
@keyframes ledFlip{0%{transform:perspective(220px) rotateX(-85deg);opacity:.25}100%{transform:none;opacity:1}}
.led.running{animation:ledPulse 1.2s ease-in-out infinite}
@keyframes ledPulse{0%,100%{box-shadow:inset 0 0 0 1px #1d1d20,0 0 0 0 rgba(242,140,40,0)}50%{box-shadow:inset 0 0 0 1px #1d1d20,0 0 18px 4px rgba(242,140,40,.55)}}
.led.glow,.led-ready{animation:ledGlow 1.4s ease-out 2}
@keyframes ledGlow{0%{text-shadow:0 0 8px rgba(242,140,40,.55)}40%{text-shadow:0 0 22px rgba(242,140,40,1),0 0 4px #fff}100%{text-shadow:0 0 8px rgba(242,140,40,.55)}}
/* "How to make" progress rail */
.steps.railed{position:relative}
.steps.railed::before,.steps.railed::after{content:"";position:absolute;left:calc(var(--rx) - 1.5px);top:var(--rt);width:3px;border-radius:2px;pointer-events:none;z-index:0}
.steps.railed::before{height:var(--rh);background:var(--muted);opacity:.45}
.steps.railed::after{height:var(--rf,0px);background:var(--sel);transition:height .38s cubic-bezier(.3,.7,.2,1)}
.tick input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:1px 0 0;flex:none;border:2px solid var(--muted);border-radius:6px;background:var(--card);display:inline-grid;place-content:center;position:relative;z-index:1;cursor:pointer;transition:background .15s,border-color .15s}
.tick input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid #0A0A0B;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s ease-out}
.tick input[type=checkbox]:checked{background:var(--sel);border-color:var(--sel)}
.tick input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
.tick input[type=checkbox].pop{animation:tickPop .3s ease-out}
@keyframes tickPop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.tick input[type=checkbox]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[data-made]:not(:disabled),[data-act="made"]:not(:disabled){background:var(--sel);color:var(--sel-ink)}
.madepulse{animation:madePulse .9s ease-out 1}
@keyframes madePulse{0%{box-shadow:0 0 0 0 rgba(242,140,40,.75);transform:scale(1)}35%{transform:scale(1.04)}100%{box-shadow:0 0 0 16px rgba(242,140,40,0);transform:scale(1)}}
/* stock as mini bottles */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;align-items:start}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px 10px;text-align:center;cursor:pointer;min-width:0}
.bcard:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bottle{display:block;width:56px;height:110px;margin:0 auto 8px;overflow:visible}
.liq{transition:transform 1s cubic-bezier(.25,.8,.25,1)}
.slosh .wave{animation:slosh .9s linear 2}
@keyframes slosh{from{transform:translateX(0)}to{transform:translateX(-30px)}}
.bname{font-weight:600;font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}
.bamt{font-weight:700;font-size:13.5px;margin-top:3px}
.bamt .warn{color:var(--out);font-size:11px;font-weight:700;margin-left:4px}
.bpct{font-size:11.5px;color:var(--muted)}
.bdet{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.bdet .linkbtn{font-size:12px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

    }});
  var r = document.querySelector('[data-idreset]');
  if (r) r.onclick = function(){ delete state.cartIds[id]; save(); var y = window.scrollY; render(); window.scrollTo(0, y); toast('Using the app\u2019s IDs for ' + i.name + '.'); };
}

/* ---------- start ---------- */
try { var th = localStorage.getItem('mixbench.theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
lastSaved = jcopy(state);
/* keep the tidied-up copy (old big-bottle prices removed, old batches keep their recipe) */
if (typeof raw === 'string' && raw && JSON.stringify(state) !== raw) { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
render();
initCloud();
initSync();
initSteepTools();
startPwa();
})();
</script>

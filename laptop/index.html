<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix Bench</title>
<meta name="mb-version" content="2026-11-18-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --sel:#F28C28; --sel-ink:#0A0A0B; --neon-g:#39FF14; --neon-a:#FFB000; --neon-r:#FF1744; --lamp-ring:rgba(0,0,0,.35);
  --bg:#F4F4F5; --card:#FFFFFF; --ink:#0A0A0B; --muted:#6E6E73; --line:#E6E6E8; --soft:#F0F0F2; --side:#FFFFFF;
  --accent:#0A0A0B; --accent-ink:#FFFFFF; --ok:#1E8A4F; --low:#C2620E; --out:#C62F3E; --amber:#D99A0B;
  --font:'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0B; --card:#141416; --ink:#F2F2F3; --muted:#8E8E93; --line:#26262A; --soft:#1D1D20; --side:#101012;
    --lamp-ring:rgba(0,0,0,.6);
    --accent:#F2F2F3; --accent-ink:#0A0A0B; --ok:#4CC08A; --low:#E98B4E; --out:#F0606F; --amber:#F2C14E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --card:#141416; --ink:#F2F2F3; --muted:#8E8E93; --line:#26262A; --soft:#1D1D20; --side:#101012;
  --lamp-ring:rgba(0,0,0,.6);
  --accent:#F2F2F3; --accent-ink:#0A0A0B; --ok:#4CC08A; --low:#E98B4E; --out:#F0606F; --amber:#F2C14E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
.app{display:grid;grid-template-columns:230px 1fr;height:100%}
aside{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;letter-spacing:-.02em;padding:0 10px 14px}
.logo{width:40px;height:40px;flex:none;display:block;border-radius:22%}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav[aria-current="page"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.nav .badge{margin-left:auto;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
.side-foot b{color:var(--ink);font-weight:600}
main{overflow:auto;padding:28px 34px 60px}
.wrap{max-width:1320px;margin:0 auto}
h1{font-size:24px;letter-spacing:-.025em;margin:0 0 4px;font-weight:700}
h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
h3{font-size:15px;margin:0;font-weight:600}
.lede{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card + .card{margin-top:14px}
.cols > .card + .card,.two > .card{margin-top:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.cols{display:grid;gap:16px;align-items:start}
.plan-cols{grid-template-columns:340px minmax(0,1fr)}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.shop-cols{grid-template-columns:minmax(0,1fr) 340px}
.hist-cols{grid-template-columns:340px minmax(0,1fr)}
.data-cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.secondary{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--out);color:#fff}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{padding:6px 10px;font-size:12px}
.linkbtn{border:0;background:none;color:var(--ink);font-weight:500;padding:4px 0;cursor:pointer;font-size:12px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.seg.ratios{display:grid;grid-template-columns:repeat(3,auto)}
.field,select.field{width:100%;border:1px solid var(--line);border-radius:9px;padding:0 11px;height:38px;background:var(--bg);font-size:14px}
textarea.field{height:auto;padding:10px 11px;font-size:12.5px;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.lamp{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.lamp.green{background:var(--neon-g);box-shadow:0 0 0 1px var(--lamp-ring),0 0 6px 1px rgba(57,255,20,.7)}
.lamp.amber{background:var(--neon-a);box-shadow:0 0 0 1px var(--lamp-ring),0 0 6px 1px rgba(255,176,0,.7)}
.lamp.red{background:var(--neon-r);box-shadow:0 0 0 1px var(--lamp-ring),0 0 6px 1px rgba(255,23,68,.65)}
.light{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.light.green{color:var(--ok)} .light.amber{color:var(--low)} .light.red{color:var(--out)}
.rlist{display:grid;gap:2px}
.ritem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 11px;border-radius:9px;cursor:pointer;font-weight:500}
.ritem:hover{background:var(--soft)}
.ritem[aria-current="true"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.ritem[aria-current="true"] .sub{color:var(--sel-ink)}
.ritem .sub{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.stepper button{width:36px;height:38px;border:0;background:none;font-size:18px;cursor:pointer}
.stepper input{width:70px;height:38px;border:0;background:none;text-align:center;font-weight:600;font-size:14px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tick{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.tick input{width:19px;height:19px;margin:1px 0 0;flex:none;accent-color:var(--sel)}
input[type=checkbox]{accent-color:var(--sel)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:15px;line-height:1.5}
.steps li{padding:7px 10px;border-radius:8px}
.steps li:hover{background:var(--soft)}
.steps li.note{color:var(--muted);font-size:13px}
.steps li.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr:hover td{background:var(--soft)}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.low{color:var(--low)} .pill.out{color:var(--out)}
.meter{height:3px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:5px;width:120px}
.meter span{display:block;height:100%;background:var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:22px;letter-spacing:-.01em}
.stat{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.stat .v{text-align:right;font-weight:600}
.sticky{position:sticky;top:0}
.pr{width:96px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;font-size:13px}
.pr:disabled{background:var(--soft);color:var(--muted);border-color:transparent;-webkit-text-fill-color:var(--muted);opacity:1}
.mixgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px}
.mixrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:8px}
.mixrow.on{background:var(--soft)}
.mixrow label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.starbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;cursor:pointer}
.starbtn.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.stepbar{display:flex;gap:4px;margin-top:8px}
.stepbar button{flex:1;border:0;border-radius:6px;padding:6px 4px;font-size:11px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--muted)}
.stepbar button.on{background:var(--sel);color:var(--sel-ink)}
.meterbar{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:6px}
.meterbar span{display:block;height:100%}
dialog{border:1px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);padding:22px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-size:17px;margin-bottom:8px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30}
.banner{background:var(--out);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:22px 0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.scroll{overflow:auto}
@media (max-width:1050px){.plan-cols,.shop-cols,.hist-cols,.data-cols,.two{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.brand,.side-foot{display:none}main{padding:18px 14px 40px}}
:root{--bar-fill:var(--sel);--bar-empty:#0A0A0B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar-empty:#000}}
:root[data-theme="dark"]{--bar-empty:#000}
.stockgrid{display:grid;align-items:start;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;padding-top:6px;padding-bottom:6px}
.srow{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.srow:hover{background:var(--soft)}
.srow .amt{font-weight:700}
.srow .warn{color:var(--out);font-size:12px;font-weight:600;margin-left:6px}
.sbar{height:8px;border-radius:4px;background:var(--bar-empty);overflow:hidden;margin-top:8px;box-shadow:inset 0 0 0 1px var(--line)}
.sbar span{display:block;height:100%;background:var(--bar-fill);border-radius:4px 0 0 4px}
.sbar.low span{background:var(--out)}
.sdet{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tstars{display:flex;gap:4px;margin:6px 0 8px}
.tstar{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.tstar.on{color:var(--bar-fill)}
.trow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:8px;margin:6px 0}
.trow > span{font-size:12px;color:var(--muted);font-weight:600}
.tchips{display:flex;flex-wrap:wrap;gap:4px}
.tchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.tchip.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.taste{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.taste-h{font-weight:700}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.fb-h{font-weight:700;font-size:13px}
.stars{color:var(--bar-fill);letter-spacing:1px}
.fb-btns{display:flex;gap:6px;margin-top:8px}
dialog{width:min(620px,94vw);max-height:90vh;overflow:auto}
.seg button:disabled{opacity:.35;cursor:default}
@media (max-width:1050px){.stockgrid{grid-template-columns:minmax(0,1fr)}}
.led{display:flex;align-items:flex-start;justify-content:center;gap:4px;flex-wrap:wrap;background:#000;color:var(--sel);border-radius:12px;padding:12px 10px 10px;margin:10px 0 8px;font-family:'Share Tech Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;text-shadow:0 0 8px rgba(242,140,40,.55);box-shadow:inset 0 0 0 1px #1d1d20;font-variant-numeric:tabular-nums}
.led-u{display:flex;flex-direction:column;align-items:center;min-width:0}
.led-d{font-size:clamp(28px,9vw,46px);line-height:1;letter-spacing:.04em}
.led-l{font-size:9px;letter-spacing:.14em;opacity:.7;margin-top:4px;font-family:var(--font)}
.led-c{font-size:clamp(24px,8vw,40px);line-height:1;opacity:.8}
.led-ready{font-size:clamp(22px,7vw,34px);letter-spacing:.08em;padding:6px 0}
.led-sm{font-size:clamp(32px,10vw,48px);line-height:1;letter-spacing:.06em;padding:14px 10px}
.tm-done{margin:2px 0 8px;padding:8px 10px;border-radius:8px;background:var(--sel);color:var(--sel-ink);font-weight:700;text-align:center}
.tbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tbtns .btn{width:100%;margin:0}
.tbtns2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbtns2 .btn{width:auto;margin:0}
.shake-banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--sel);color:var(--sel-ink);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.shake-banner .btn.secondary{background:rgba(0,0,0,.12);color:var(--sel-ink)}
.steepcard .pill.ready,.pill.ready{background:var(--ok);color:#fff}
.steep-cols{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.steepsum{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn.sm{padding:6px 10px;font-size:12px}
@media (max-width:1050px){.steep-cols{grid-template-columns:minmax(0,1fr)}}
.prevord{border-bottom:1px solid var(--line);padding:10px 0}
.prevord:last-child{border-bottom:0}
.prevord > summary.prevsum{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;color:var(--ink);text-decoration:none;font-size:14px;font-weight:400;margin:0}
.prevord > summary.prevsum::-webkit-details-marker{display:none}
.prevord > summary.prevsum::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-3px 4px 0 4px;flex:none}
.prevord[open] > summary.prevsum::after{transform:rotate(-135deg);margin-top:3px}
.prevord[open] > summary.prevsum{margin-bottom:8px}
/* Plan rows: orange band, bold black text, black arrow; neon lights get a thin black outline so they stand out on orange */
.steepsum{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.steepsum b{font-weight:700}
.steepsum .muted{color:var(--sel-ink)}
.steepsum .btn.secondary{background:var(--sel-ink);color:var(--sel)}
.onorange .lamp.green{box-shadow:0 0 0 1.5px #000,0 0 6px 1px rgba(57,255,20,.7)}
.onorange .lamp.amber{box-shadow:0 0 0 1.5px #000,0 0 6px 1px rgba(255,176,0,.7)}
.onorange .lamp.red{box-shadow:0 0 0 1.5px #000,0 0 6px 1px rgba(255,23,68,.65)}
.rlist{gap:6px}
.ritem{background:var(--sel);color:var(--sel-ink);font-weight:700}
.ritem:hover{background:var(--sel);filter:brightness(.94)}
.ritem::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);flex:none;margin:0 4px 0 2px}
.ritem .sub{color:inherit;font-weight:600}
.ritem[aria-current="true"]{background:#0A0A0B;color:var(--sel);box-shadow:inset 0 0 0 2px var(--sel);filter:none}
.ritem[aria-current="true"] .sub{color:var(--sel)}
.setcard{padding:0;overflow:hidden}
.sethead{background:var(--sel);color:var(--sel-ink);font-weight:700;font-size:15px;padding:12px 18px}
.setcard > .row{padding:14px 18px 18px}
/* motion: short, light, off with Reduce Motion */
:root{--bottle-edge:#2b2b2f}
.view-in{animation:viewIn .2s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.confetti{position:fixed;width:0;height:0;pointer-events:none;z-index:60}
.confetti i{position:absolute;left:-3px;top:-5px;width:7px;height:10px;border-radius:2px;animation:cf .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),calc(var(--y) + 60px)) rotate(var(--r));opacity:0}}
.led-d{display:inline-block;transform-origin:50% 50%}
.led-d.flip{animation:ledFlip .32s ease-out}
@keyframes ledFlip{0%{transform:perspective(220px) rotateX(-85deg);opacity:.25}100%{transform:none;opacity:1}}
.led.running{animation:ledPulse 1.2s ease-in-out infinite}
@keyframes ledPulse{0%,100%{box-shadow:inset 0 0 0 1px #1d1d20,0 0 0 0 rgba(242,140,40,0)}50%{box-shadow:inset 0 0 0 1px #1d1d20,0 0 18px 4px rgba(242,140,40,.55)}}
.led.glow,.led-ready{animation:ledGlow 1.4s ease-out 2}
@keyframes ledGlow{0%{text-shadow:0 0 8px rgba(242,140,40,.55)}40%{text-shadow:0 0 22px rgba(242,140,40,1),0 0 4px #fff}100%{text-shadow:0 0 8px rgba(242,140,40,.55)}}
/* "How to make" progress rail */
.steps.railed{position:relative}
.steps.railed::before,.steps.railed::after{content:"";position:absolute;left:calc(var(--rx) - 1.5px);top:var(--rt);width:3px;border-radius:2px;pointer-events:none;z-index:0}
.steps.railed::before{height:var(--rh);background:var(--muted);opacity:.45}
.steps.railed::after{height:var(--rf,0px);background:var(--sel);transition:height .38s cubic-bezier(.3,.7,.2,1)}
.tick input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:1px 0 0;flex:none;border:2px solid var(--muted);border-radius:6px;background:var(--card);display:inline-grid;place-content:center;position:relative;z-index:1;cursor:pointer;transition:background .15s,border-color .15s}
.tick input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid #0A0A0B;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s ease-out}
.tick input[type=checkbox]:checked{background:var(--sel);border-color:var(--sel)}
.tick input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
.tick input[type=checkbox].pop{animation:tickPop .3s ease-out}
@keyframes tickPop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.tick input[type=checkbox]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[data-made]:not(:disabled),[data-act="made"]:not(:disabled){background:var(--sel);color:var(--sel-ink)}
.madepulse{animation:madePulse .9s ease-out 1}
@keyframes madePulse{0%{box-shadow:0 0 0 0 rgba(242,140,40,.75);transform:scale(1)}35%{transform:scale(1.04)}100%{box-shadow:0 0 0 16px rgba(242,140,40,0);transform:scale(1)}}

  d.innerHTML = '<h3>' + esc(o.title) + '</h3>' + (o.body || '') + '<div class="dlg-actions"><button class="btn secondary" data-x="cancel">' + esc(o.cancel || 'Cancel') + '</button>' + (o.confirm ? '<button class="btn' + (o.danger ? ' danger' : '') + '" data-x="ok">' + esc(o.confirm) + '</button>' : '') + '</div>';
  document.body.appendChild(d);
  var close = function(){ d.close(); d.remove(); };
  d.addEventListener('click', function(e){
    var b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'cancel') return close();
    if (o.onConfirm(d) !== false) close();
  });
  d.addEventListener('cancel', function(e){ e.preventDefault(); close(); });
  d.showModal(); var f = $('input,select,textarea', d); if (f) f.focus();
  return d;
}

  return '<ol class="steps" style="list-style:none">' + howSteps(rec, ml).map(function(st){

    k++;

  importpaste:function(){ modal({title:'Paste your data', body:'<p class="muted small" style="margin-top:0">On the phone: Shop, then Backup and restore at the bottom, then Copy backup. Paste it here.</p><textarea id="pasted" class="field" placeholder="Paste here"></textarea>', confirm:'Continue', onConfirm:function(d){ var v = $('#pasted', d).value; setTimeout(function(){ doImport(v); }, 0); }}); },
  theme:function(t){ var v = t.dataset.v; if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); try { localStorage.setItem('mixbench.theme', v); } catch (e) {} render(); },
  reset:function(t){
    var all = t.dataset.v === 'all';
    modal({title:all ? 'Reset everything?' : 'Reset plan, stock and history?', body:'<p class="muted" style="margin:0">' + (all ? 'Everything goes back to how it was on day one, including prices.' : 'Your plan, stock and history are cleared. Prices stay.') + ' A copy is kept in the backups folder first.</p>', confirm:'Reset', danger:true, onConfirm:function(){
      var prices = state.prices, nb = state.nicBase, ship = state.ship; state = blank(); if (!all) { state.prices = prices; state.nicBase = nb; state.ship = ship; }
      state.syncOn = lastSaved ? lastSaved.syncOn : false; state.syncBase = lastSaved ? lastSaved.syncBase : 0; trackChanges(lastSaved, state, Date.now()); lastSaved = jcopy(state); syncSoon();
      state.savedAt = Date.now(); fetch('/api/data?keep=1', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state)}); ui.view = 'plan'; render(); toast('Reset. You are back to the start.');
    }});
  }
};
var CHG = {
  grams:function(t){ state.showGrams = t.checked; keep(); toast(t.checked ? 'Grams shown next to each amount.' : 'Grams hidden.'); },
  ml:function(t){ state.plan[t.dataset.id] = Math.max(0, Math.round((+t.value || 0) * 100) / 100); keep(); },
  zero:function(t){ state.zero = state.zero || {}; if (t.checked) state.zero[t.dataset.id] = true; else delete state.zero[t.dataset.id]; keep(); toast(t.checked ? 'No nicotine. Recipe adjusted.' : 'Back to ' + planMg(t.dataset.id) + 'mg.'); },
  steepdays:function(t){ state.steeps = state.steeps || {}; state.steeps[t.dataset.id] = +t.value; keep(); toast(recById[t.dataset.id].name + ' now steeps for ' + t.value + ' day' + (+t.value === 1 ? '' : 's') + '.'); },
  tick:function(t){ var id = t.dataset.id; setTick(id, +t.dataset.k, t.checked); if (t.hasAttribute('data-shakestep')) { if (t.checked) mixTimerStart(id); else mixTimerStop(id); } keep(); mixTimerPaint(); },
  pick:function(t){ var id = t.dataset.id; if (t.checked) state.mix.picks[id] = null; else { delete state.mix.picks[id]; delete state.mix.main[id]; } keep(); },
  pct:function(t){ var v = parseFloat(t.value); state.mix.picks[t.dataset.id] = (v >= 0 && v <= 30) ? Math.round(v * 10) / 10 : null; keep(); },
  mixname:function(t){ state.mix.name = (t.value || '').trim().slice(0, 40) || 'My mix'; keep(); },
  price:function(t){
    var id = t.dataset.id, f = t.dataset.f, p = state.prices[id] || {}, v = +t.value;
    if (t.value.trim() === '' || !(v > 0)) { render(); toast('Kept the previous price.'); return; } p[f] = v; state.prices[id] = p; save(); paintShopList($('#main')); toast('Saved.');
  },
  q:function(t){ if (!setQty(t.dataset.id, t.value)) { render(); return; } save(); paintShopList($('#main')); },
  lp:function(t){ if (!setUnitPrice(t.dataset.id, t.value)) { render(); toast('Kept the previous price.'); return; } save(); paintShopList($('#main')); toast('Saved.'); },
  additem:function(t){ if (!t.value) return; state.cart = state.cart || {}; state.cart[t.value] = 1; keep(); toast(ingById[t.value].name + ' added to the list.'); },
  pack:function(t){ var id = t.dataset.id, v = +t.value; if (t.value.trim() === '' || !(v > 0)) { render(); toast('Kept the previous price.'); return; } var p = state.prices[id] || {}; p.packs = p.packs || {}; p.packs[t.dataset.n] = v; state.prices[id] = p; keep(); toast('Saved.'); },
  ship:function(t){ var sp = t.dataset.shop, f = t.dataset.f; state.ship = state.ship || {}; var o = state.ship[sp] || {}, v = +t.value; if (t.value.trim() === '' || !isFinite(v) || v < 0) { render(); toast('Kept the previous amount.'); return; } o[f] = v; state.ship[sp] = o; keep(); toast('Saved.'); }
};
document.addEventListener('click', function(e){ var sd = e.target.closest('[data-steepdone]'); if (sd) { ACT.stdone({dataset:{id:sd.getAttribute('data-steepdone')}}); return; }
  var bd = e.target.closest('[data-bdetail]'); if (bd) { batchDialog(bd.getAttribute('data-bdetail')); return; }
  var fb = e.target.closest('[data-taccept],[data-tignore]'); if (fb) { var rid = fb.getAttribute('data-taccept') || fb.getAttribute('data-tignore'); ACT[fb.hasAttribute('data-taccept') ? 'taccept' : 'tignore']({dataset:{id:rid}}); return; } });
document.addEventListener('click', function(e){ var t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) { e.preventDefault(); ACT[t.dataset.act](t, e); } });
document.addEventListener('input', function(e){ var t = e.target.closest && e.target.closest('[data-q]'); if (t && setQty(t.dataset.id, t.value)) paintShopList($('#main')); });
document.addEventListener('toggle', function(e){ var d = e.target; if (d && d.matches && d.matches('details[data-bstepsbox]')) ui.stepsOpen = d.open; }, true);
document.addEventListener('change', function(e){
  if (e.target.id === 'impfile'){ var f = e.target.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ doImport(String(rd.result)); }; rd.readAsText(f); e.target.value = ''; return; }
  if (rendering) return;
  var t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t);
});

/* ---------- start ---------- */
try { var th = localStorage.getItem('mixbench.theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
document.addEventListener('toggle', function(e){ var d = e.target; if (d && d.matches && d.matches('details[data-box]')) { ui.prevOpen = ui.prevOpen || {}; ui.prevOpen[d.getAttribute('data-box')] = d.open; } }, true);
initSteepTools();
/* ---------- updates: the laptop fetches new versions itself ---------- */
var upd = {info:null, busy:false, msg:'', kind:''};
function versionText(v){ var m = String(v || '').match(/^(\d{4})-(\d\d)-(\d\d)-(\d+)$/); if (!m) return v || 'unknown'; return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) + ' (' + m[4] + ')'; }
function updateHtml(){
  var i = upd.info; if (!(i && i.available) && !upd.msg) return '';
  return '<div class="card updcard"><div class="row between wrapflex" style="gap:12px"><div><div style="font-weight:800">' + (i && i.available ? 'A new version of Mix Bench is ready' : 'Mix Bench update') + '</div>' +
    '<div class="small muted">' + (i && i.available ? 'Version ' + esc(versionText(i.latest)) + '. You have ' + esc(versionText(i.current)) + '. Your data stays exactly as it is.' : '') + '</div>' +
    (upd.msg ? '<div class="small" style="margin-top:4px;font-weight:600;color:' + (upd.kind === 'warn' ? 'var(--low)' : 'var(--ok)') + '">' + esc(upd.msg) + '</div>' : '') + '</div>' +
    (i && i.available ? '<button class="btn sel" data-act="appupdate"' + (upd.busy ? ' disabled' : '') + '>' + (upd.busy ? 'Updating\u2026' : 'Update now') + '</button>' : '') + '</div></div>';
}
function checkUpdate(){
  fetch('/api/update/check', {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(i){
    if (!i || !i.latest) return; var was = upd.info && upd.info.available; upd.info = i; if (i.available !== was) render();
  }).catch(function(){});
}
ACT.appupdate = function(){
  if (upd.busy) return; upd.busy = true; upd.msg = ''; render();
  fetch('/api/update/install', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}).then(function(r){ return r.json(); }).then(function(x){
    upd.busy = false;
    if (!x || !x.ok) { upd.kind = 'warn'; upd.msg = 'Couldn\u2019t update: ' + ((x && x.error) || 'unknown problem') + '. Nothing was changed.'; render(); return; }
    if (x.restart) { upd.info = null; upd.kind = ''; upd.msg = 'Updated. Close the Mix Bench window (the black one) and start Mix Bench again to finish.'; render(); return; }
    upd.kind = ''; upd.msg = 'Updated. Reloading\u2026'; render(); setTimeout(function(){ location.reload(); }, 900);
  }).catch(function(){ upd.busy = false; upd.kind = 'warn'; upd.msg = 'Couldn\u2019t reach the Mix Bench window. Is it still open?'; render(); });
};
setTimeout(checkUpdate, 2500); setInterval(checkUpdate, 6 * 3600 * 1000);
fetch('/api/data').then(function(r){ return r.json(); }).then(function(d){
  var before = d && d.plan ? JSON.stringify(d) : '';
  if (d && d.plan) state = migrate(d); else state = blank();
  lastSaved = jcopy(state);
  syncRecipes(); if (!recById[ui.rec]) ui.rec = RECIPES[0].id;
  render();
  /* save straight away for a new file, or when loading repaired an older data.json */
  if (!before || JSON.stringify(state) !== before) save(); else { saveInfo.state = 'saved'; saveInfo.at = new Date(); paintSave(); }
  loadSyncInfo(); if (state.syncOn) setTimeout(function(){ runSync(false); }, 800);
  initOrderAsk();
}).catch(function(){
  state = blank(); syncRecipes(); render(); serverUp = false; saveInfo.state = 'error'; paintSave();
  $('#main').insertAdjacentHTML('afterbegin', '<div class="banner">Mix Bench cannot reach its local server, so nothing will be saved. Close this tab and start it with start.bat (Windows), start.command (Mac) or start.sh (Linux).</div>');
});
setInterval(function(){ if (ui.view === 'plan' && !document.querySelector('dialog')) { var e = document.activeElement; if (!(e && /INPUT|TEXTAREA|SELECT/.test(e.tagName))) render(); } }, 60000);
setInterval(function(){ if (state && state.syncOn && !document.hidden) runSync(false); }, 60000);
window.addEventListener('focus', function(){ if (state && state.syncOn) runSync(false); });

})();
</script></body></html>
